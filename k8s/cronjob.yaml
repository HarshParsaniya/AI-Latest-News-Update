apiVersion: batch/v1
kind: CronJob
metadata:
  name: ai-news-digest
spec:
  schedule: "0 8 * * *"
  timeZone: Asia/Kolkata
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: digest
              image: ai-news-digest:latest
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: ai-news-digest-secrets
                - configMapRef:
                    name: ai-news-digest-config
              env:
                - name: SQLITE_PATH
                  value: /data/digest.db
              volumeMounts:
                - name: digest-data
                  mountPath: /data
          volumes:
            - name: digest-data
              persistentVolumeClaim:
                claimName: ai-news-digest-pvc
